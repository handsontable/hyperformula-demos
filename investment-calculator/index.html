<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperFormula Investment Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/autonumeric@4.10.5"></script>
    <link rel="stylesheet" href="./src/styles.css" />
    <meta charset="UTF-8" />
  </head>

  <body>
    <div>
      <h1>Investment Calculator</h1>

      <div id="calc">
        <section id="input">
          <h2>Investment Input</h2>
          <form>
            <fieldset>
              <label>Initial investment</label>
              <input id="initial" value="-70000" />
            </fieldset>

            <div>
              <fieldset>
                <label>Year 1</label>
                <input id="y1" value="12000" />
              </fieldset>
              <fieldset>
                <label>Year 2</label>
                <input id="y2" value="15000" />
              </fieldset>
              <fieldset>
                <label>Year 3</label>
                <input id="y3" value="18000" />
              </fieldset>
              <fieldset>
                <label>Year 4</label>
                <input id="y4" value="21000" />
              </fieldset>
              <fieldset>
                <label>Year 5</label>
                <input id="y5" value="26000" />
              </fieldset>
            </div>

            <fieldset>
              <label>Discount rate</label>
              <input id="discount" value="10" />
            </fieldset>
            <fieldset>
              <button>Run Calculation</button>
            </fieldset>
          </form>
        </section>
        <section id="result">
          <h2>Results</h2>
          <div class="Cards">
            <div class="Card" data-title="=IRR(A1:A4)">
              <h3>IRR (3 Years)</h3>
              <input id="resullt3y" placeholder="=IRR(A1:A4)" disabled />
            </div>
            <div class="Card" data-title="=IRR(A1:A6)">
              <h3>IRR (5 Years)</h3>
              <input id="resullt5y" placeholder="=IRR(A1:A6)" disabled />
            </div>
            <div class="Card" data-title="=NPV(A7,A2:A6)+A1">
              <h3>Net Present Value</h3>
              <input id="npv" placeholder="=NPV(A7,A2:A6)+A1" disabled />
            </div>
            <div class="Card" data-title='=COUNTIF(B1:B6,"<0")'>
              <h3>Payback Period</h3>
              <input
                id="payback"
                disabled
                placeholder='=COUNTIF(B1:B6,"<0")'
              />
            </div>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="src/index.js"></script>
  </body>
</html>
